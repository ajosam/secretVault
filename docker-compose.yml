services:
  postgres:
    image: postgres:17-alpine
    container_name: vaultline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaultline
      POSTGRES_PASSWORD: vaultline_dev_password
      POSTGRES_DB: vaultline
    ports:
      - "5434:5432"
    volumes:
      - vaultline_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultline -d vaultline"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vaultline_pg_data:
